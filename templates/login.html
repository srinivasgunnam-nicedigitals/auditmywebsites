<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <script>
        // Prevent FOUC by applying collapsed state before DOM renders
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.documentElement.classList.add('sidebar-collapsed-preload');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Audit My Websites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Hide placeholder on focus */
        input:focus::placeholder,
        textarea:focus::placeholder {
            color: transparent !important;
            transition: color 0.2s ease;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/static/svg/sitetester-icon.svg">
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-8 shadow-2xl relative">

            <div class="flex items-center gap-2 mb-8 justify-center">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M24.5 14C24.5 19.799 19.799 24.5 14 24.5C8.20101 24.5 3.5 19.799 3.5 14C3.5 8.20101 8.20101 3.5 14 3.5C19.799 3.5 24.5 8.20101 24.5 14Z"
                            stroke="#4F7CFF" stroke-width="2" />
                        <path d="M8.16667 14C8.16667 10.7783 10.7783 8.16667 14 8.16667" stroke="#4F7CFF"
                            stroke-width="2" stroke-linecap="round" />
                        <path
                            d="M15.1667 14C15.1667 14.6443 14.6443 15.1667 14 15.1667C13.3556 15.1667 12.8333 14.6443 12.8333 14C12.8333 13.3556 13.3556 12.8333 14 12.8333C14.6443 12.8333 15.1667 13.3556 15.1667 14Z"
                            stroke="#4F7CFF" stroke-width="2" />
                        <path d="M14 14L18.6667 9.33333" stroke="#4F7CFF" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <span class="font-bold text-white tracking-tight text-xl">Audit My Websites</span>
            </div>


            <!-- Primary Action: Google Auth -->
            <div id="google-auth-container" class="w-full mb-6">
                <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-context="signin" data-ux_mode="popup"
                    data-callback="handleCredentialResponse" data-auto_prompt="false">
                </div>
                <div id="google_btn_login" class="flex justify-center" style="min-height: 40px;"></div>

                <!-- Fallback message for iframe environments -->
                <div id="google-iframe-warning"
                    class="hidden p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl text-center">
                    <p class="text-amber-500 text-sm mb-3">Google Sign-In is unavailable in the Responsive View.</p>
                    <a href="/login" target="_top"
                        class="inline-flex items-center gap-2 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg transition-colors">
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        Open in New Tab
                    </a>
                </div>
            </div>

            <div class="relative flex items-center justify-center mb-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-800"></div>
                </div>
                <span class="relative bg-slate-900 px-4 text-sm text-slate-500">or</span>
            </div>

            <!-- Secondary Action: Credentials -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Email</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </div>
                        <input type="text" name="username" required
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-600 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition"
                            placeholder="Enter your email">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Password</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="loginPassword" name="password" required
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-10 pr-12 py-3 text-white placeholder-slate-600 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition"
                            placeholder="Enter your password">
                        <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition focus:outline-none">
                            <i data-lucide="eye" id="loginEyeIcon" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="mt-2 text-right">
                        <a href="/forgot-password"
                            class="text-sm text-blue-500 hover:text-blue-400 transition hover:underline">Forgot your
                            password?</a>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow-lg shadow-blue-500/20 transition-all transform hover:scale-[1.01]">
                        Log in
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm border-t border-slate-800/50 pt-6">
                <p class="text-slate-400">Don't have an account?
                    <a href="/register"
                        class="text-blue-500 hover:text-blue-400 font-medium transition hover:underline">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function handleCredentialResponse(response) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const result = await res.json();

                if (res.ok) {
                    window.location.href = result.redirect_url || '/platform/dashboard';
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: result.detail || 'Google login failed',
                        background: '#0f172a',
                        color: '#f8fafc',
                        confirmButtonColor: '#3b82f6'
                    });
                }
            } catch (error) {
                console.error('Google Auth Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Network error occurred during Google Sign-In',
                    background: '#0f172a',
                    color: '#f8fafc',
                    confirmButtonColor: '#3b82f6'
                });
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId); // This is an <i> element now

            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Responsive Google Button rendering with debouncing
        let resizeTimer;
        function renderGoogleButton() {
            if (!window.google || !window.google.accounts || !window.google.accounts.id) {
                console.log("Google library not ready yet...");
                return;
            }

            const refBtn = document.querySelector('button[type="submit"]');
            const targetDiv = document.getElementById("google_btn_login");

            if (refBtn && targetDiv) {
                const width = refBtn.offsetWidth;
                console.log(`Rendering Google button with width: ${width}`);
                google.accounts.id.renderButton(
                    targetDiv,
                    {
                        theme: "filled_black",
                        size: "large",
                        shape: "rectangular",
                        text: "sign_in_with",
                        logo_alignment: "left",
                        width: width || 400
                    }
                );
            }
        }

        function debouncedRender() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderGoogleButton, 200);
        }

        // Initialize with polling to be safe
        function initGoogleButton() {
            // Check if running in an iframe
            const isInIframe = window.self !== window.top;

            if (isInIframe) {
                console.warn("Google Sign-In is disabled due to iframe environment.");
                const warning = document.getElementById('google-iframe-warning');
                const btn = document.getElementById('google_btn');
                if (warning) warning.classList.remove('hidden');
                if (btn) btn.classList.add('hidden');
                return;
            }

            let attempts = 0;
            const check = setInterval(() => {
                attempts++;
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    clearInterval(check);
                    renderGoogleButton();
                } else if (attempts > 50) {
                    clearInterval(check);
                    console.error("Google library failed to load after 5s");
                }
            }, 100);
        }

        window.addEventListener('load', initGoogleButton);
        window.addEventListener('resize', debouncedRender);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (response.ok) {
                    // Cookie is now set by backend - just redirect
                    window.location.href = '/platform/dashboard';
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: result.detail || 'Invalid credentials',
                        background: '#0f172a',
                        color: '#f8fafc',
                        confirmButtonColor: '#3b82f6'
                    });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Network error occurred',
                    background: '#0f172a',
                    color: '#f8fafc',
                    confirmButtonColor: '#3b82f6'
                });
            }
        });
    </script>
</body>

</html>
